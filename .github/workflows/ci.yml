name: CI

# The only CI. Fast, CPU-only checks on every push/PR: no dataset
# download, no model weights, no CUDA, no Modal. Anything needing those
# is run by hand — `scripts/check_trainer_flags.py` when the pinned
# trainer revision or the command builder changes, `scripts/smoke_gpu.sh`
# or `modal run ... --step smoke` before a real training run.
on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install fvqa (dev extra only — no torch/transformers)
        run: pip install -e '.[dev]'

      - name: ruff check
        run: ruff check .

      - name: pytest
        run: pytest -q

      - name: compileall
        run: python -m compileall -q src

      - name: fvqa config loads and validates
        run: python -m fvqa.cli config
