name: Trainer integration

# Checks build_train_command()'s output against the actual, pinned
# revision of the external trainer (2U1/Qwen-VL-Series-Finetune), and
# that the local pipeline still builds a real training command end to
# end. Split out from ci.yml because it clones another repo and downloads
# the FVQA release (~451MB) — not something every PR should pay for, but
# something that must run before either drifts out from under this
# project unnoticed. No GPU/CUDA here; that's Modal's job (see M4).
on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday 06:00 UTC

jobs:
  trainer-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install fvqa (dev extra only — no torch/transformers)
        run: pip install -e '.[dev]'

      - name: Read the pinned trainer revision
        id: pin
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          from fvqa.config import load_config
          config = load_config()
          print(f"url={config.trainer.repo_url}")
          print(f"revision={config.trainer.revision}")
          PY

      - name: Clone the trainer at the pinned revision
        run: |
          git init -q trainer
          git -C trainer remote add origin "${{ steps.pin.outputs.url }}"
          git -C trainer fetch --depth 1 origin "${{ steps.pin.outputs.revision }}"
          git -C trainer checkout -q FETCH_HEAD

      - name: Verify entry point and DeepSpeed config exist
        run: |
          test -f trainer/src/train/train_sft.py
          test -f trainer/scripts/zero2.json

      - name: Verify every flag build_train_command() emits is one the trainer accepts
        run: python scripts/check_trainer_flags.py trainer

      - name: Download FVQA (not on HuggingFace, no auth needed)
        run: |
          curl -L -o fvqa.zip "https://www.dropbox.com/s/iyz6l7jhbt6jb7q/new_dataset_release.zip?dl=1"
          unzip -q fvqa.zip -d data/fvqa

      - name: fvqa prepare (small slice, just to exercise the loader)
        run: fvqa prepare --limit 20

      - name: fvqa train --dry-run against the pinned trainer
        run: |
          fvqa train \
            --set trainer.repo_url="${{ steps.pin.outputs.url }}" \
            --set trainer.revision="${{ steps.pin.outputs.revision }}" \
            --dry-run
